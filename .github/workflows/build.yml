name: Build iOS Dylib

on:
  workflow_dispatch:
  push:
    paths:
      - 'Tweak.xm'
      - 'Makefile'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          sudo mkdir -p /opt/theos
          sudo chown $(whoami) /opt/theos
          git clone --recursive https://github.com/theos/theos.git /opt/theos

      - name: Install ldid
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            URL="https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64"
          else
            URL="https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_x86_64"
          fi
          curl -L -o /tmp/ldid "$URL"
          chmod +x /tmp/ldid
          sudo mv /tmp/ldid /usr/local/bin/ldid

      - name: Create control file
        run: |
          cat > control << 'EOF'
          Package: com.gdhaode.taxi.driver.bypassface
          Name: BypassFace
          Version: 1.0.0
          Architecture: iphoneos-arm
          Description: Bypass face scan for Haode taxi
          Depends: mobilesubstrate
          Priority: optional
          Section: Tweaks
          EOF

      - name: Build
        run: |
          export THEOS=/opt/theos
          export TARGET_IPHONEOS_DEPLOYMENT_VERSION=14.0
          cd $GITHUB_WORKSPACE
          make clean
          make

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: BypassFace.dylib
          path: .theos/obj/debug/BypassFace.dylib
          if-no-files-found: error
